
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Dark Rounded App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Accent Ring -->
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.85"/>

  <!-- Inner Badge / Shield Plate -->
  <rect x="44" y="44" width="424" height="424" rx="76" fill="url(#shieldGrad)" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Taxi Roof Light / Badge Top -->
  <g filter="url(#shadow)">
    <rect x="216" y="96" width="80" height="24" rx="10" fill="url(#goldGrad)"/>
    <text x="256" y="113" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="13" fill="#0f172a" text-anchor="middle" letter-spacing="2">TAXI</text>
  </g>

  <!-- Modern Luxury Sedan Car Vector Graphic -->
  <g filter="url(#shadow)" transform="translate(0, 10)">
    <!-- Car Body Upper (Roof & Windows) -->
    <path d="M 166 210 L 210 148 Q 218 136 234 136 L 278 136 Q 294 136 302 148 L 346 210 Z" fill="#f8fafc" opacity="0.95"/>
    <path d="M 218 152 L 250 152 L 250 202 L 180 202 Z" fill="#0f172a" opacity="0.75"/>
    <path d="M 262 152 L 294 152 L 332 202 L 262 202 Z" fill="#0f172a" opacity="0.75"/>

    <!-- Car Main Chassis / Body -->
    <path d="M 112 210 Q 112 198 126 198 L 386 198 Q 400 198 400 210 L 416 256 Q 418 266 410 274 L 402 280 Q 396 284 386 284 L 126 284 Q 116 284 110 280 L 102 274 Q 94 266 96 256 Z" fill="url(#goldGrad)"/>

    <!-- Front & Rear Headlights -->
    <rect x="108" y="222" width="36" height="14" rx="6" fill="#ffffff" opacity="0.95"/>
    <rect x="368" y="222" width="36" height="14" rx="6" fill="#ffffff" opacity="0.95"/>
    
    <!-- Grille / Bumper -->
    <rect x="180" y="238" width="152" height="28" rx="6" fill="#0f172a" opacity="0.88"/>
    <line x1="190" y1="247" x2="322" y2="247" stroke="#fbbf24" stroke-width="2"/>
    <line x1="190" y1="256" x2="322" y2="256" stroke="#fbbf24" stroke-width="2"/>

    <!-- Wheels / Tires -->
    <circle cx="152" cy="286" r="30" fill="#020617"/>
    <circle cx="152" cy="286" r="16" fill="#94a3b8"/>
    <circle cx="152" cy="286" r="8" fill="#f59e0b"/>

    <circle cx="360" cy="286" r="30" fill="#020617"/>
    <circle cx="360" cy="286" r="16" fill="#94a3b8"/>
    <circle cx="360" cy="286" r="8" fill="#f59e0b"/>
  </g>

  <!-- Typography Brand Banner -->
  <g filter="url(#shadow)">
    <!-- GORIDE Text -->
    <text x="256" y="380" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="4">
      GORIDE
    </text>
    <!-- Subtitle: TIRUPATI BILLING -->
    <rect x="136" y="404" width="240" height="34" rx="17" fill="url(#goldGrad)"/>
    <text x="256" y="427" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="16" fill="#0f172a" text-anchor="middle" letter-spacing="3">
      TIRUPATI BILLING
    </text>
  </g>
</svg>
